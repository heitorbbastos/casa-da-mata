<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Contas da casa</title>
<style>
  :root { --fundo:#ECEEF1; --tinta:#1B2230; --apagado:#5E6978; --fio:#C9CED6; --acento:#27508E; --erro:#A8262F; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --fundo:#121820; --tinta:#E8E6DF; --apagado:#8E98A6; --fio:#2B3542; --acento:#8FB1EA; --erro:#E9737A; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--fundo); color: var(--tinta); font-family: -apple-system, "Helvetica Neue", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 24px 16px; }
  form { width: min(420px, 100%); }
  h1 { font-size: 30px; font-weight: 650; letter-spacing: -.015em; margin: 0 0 4px; }
  .sub { color: var(--apagado); font-size: 16px; margin: 0 0 28px; }
  label { display: block; font-size: 15px; color: var(--apagado); margin-bottom: 8px; }
  input[type=password] { width: 100%; font: inherit; font-size: 22px; padding: 12px 14px; border: 1.5px solid var(--fio); border-radius: 8px; background: transparent; color: var(--tinta); letter-spacing: .06em; }
  input[type=password]:focus { outline: 3px solid var(--acento); outline-offset: 1px; border-color: transparent; }
  .lembrar { display: flex; align-items: center; gap: 10px; margin: 16px 0 22px; font-size: 16px; }
  .lembrar input { width: 22px; height: 22px; accent-color: var(--acento); }
  button { font: inherit; font-size: 18px; font-weight: 600; width: 100%; padding: 14px; border: 0; border-radius: 8px; background: var(--acento); color: #fff; }
  button:disabled { opacity: .6; }
  .erro { color: var(--erro); font-weight: 600; margin: 14px 0 0; min-height: 1.4em; font-size: 16px; }
  .rodape { color: var(--apagado); font-size: 13px; margin-top: 36px; line-height: 1.5; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Contas da casa</h1>
  <p class="sub">Modelo cifrado. Precisa da senha para abrir.</p>
  <label for="s">Senha</label>
  <input id="s" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
  <label class="lembrar"><input id="l" type="checkbox"> Lembrar neste aparelho</label>
  <button id="b" type="submit">Abrir</button>
  <p class="erro" id="e" aria-live="polite"></p>
  <p class="rodape">Nada aqui está em claro: a tela e os dados ficam cifrados (AES-256-GCM) e só são abertos no seu aparelho. Retrato de 08/11 11:29, sem atualização automática.</p>
</form>

    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB.iv) }, chave, b64(BLOB.ct)).then(function (plano) {
      var html = new TextDecoder().decode(plano);
      document.open(); document.write(html); document.close();
    });
  }
  function lembrar(chave) {
    return crypto.subtle.exportKey("raw", chave).then(function (raw) { try { localStorage.setItem(GUARDA, ab64(raw)); } catch (_) {} });
  }
  function esquecer() { try { localStorage.removeItem(GUARDA); } catch (_) {} }
  if (!window.crypto || !crypto.subtle || !window.isSecureContext) {
    e.textContent = "Este navegador não consegue decifrar aqui (precisa de HTTPS e WebCrypto).";
  }
  // Chave guardada neste aparelho? Tenta abrir sem perguntar; se falhar, esquece e pergunta.
  // Só depois do `load`: document.write durante o parse ANEXA em vez de substituir a página.
  window.addEventListener("load", function () {
    try {
      var g = localStorage.getItem(GUARDA);
      if (!g) return;
      b.disabled = true; b.textContent = "Abrindo…";
      crypto.subtle.importKey("raw", b64(g), { name: "AES-GCM" }, true, ["decrypt"]).then(abrir)
        .catch(function () { esquecer(); b.disabled = false; b.textContent = "Abrir"; });
    } catch (_) {}
  });
  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    e.textContent = "";
    var senha = s.value;
    if (!senha) { e.textContent = "Digite a senha."; return; }
    b.disabled = true; b.textContent = "Abrindo…";
    derivar(senha).then(function (chave) {
      var guardar = l.checked ? lembrar(chave) : Promise.resolve();
      return guardar.then(function () { return abrir(chave); });
    }).catch(function () {
      e.textContent = "Senha incorreta. Confira maiúsculas e minúsculas e tente de novo.";
      s.value = ""; s.focus();
      b.disabled = false; b.textContent = "Abrir";
    });
  });
})();
